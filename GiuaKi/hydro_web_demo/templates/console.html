<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hydro Demo Console</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='eda.css') }}" />
    <style>
      .tabs {
        margin-top: 12px;
      }
      .tab-buttons {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }
      .tab-buttons button {
        padding: 8px 12px;
        border: none;
        border-radius: 10px;
        background: #1f2937;
        color: #e5e7eb;
        cursor: pointer;
      }
      .tab-buttons button.active {
        background: #10b981;
        color: #042417;
      }
      .tab-panels iframe {
        width: 100%;
        border: 0;
        border-radius: 12px;
        background: #0b1220;
        height: 70vh;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Hydro Demo Console</h1>
        <div class="meta">
            Chuyển nhanh giữa <b>Dự báo</b> và <b>EDA</b>. &nbsp;|&nbsp;
            <a href="{{ url_for('index') }}" target="_self">Mở Dự báo (tab này)</a> &nbsp;•&nbsp;
            <a href="{{ url_for('eda_home') }}" target="_self">Mở EDA (tab này)</a>
        </div>
      </header>

      <section class="tabs panel">
        <div class="tab-buttons">
          <button type="button" data-target="pred" class="active">
            Dự báo
          </button>
          <button type="button" data-target="eda">EDA</button>
        </div>
        <div class="tab-panels">
            <!-- Dự báo -->
            <iframe id="panel-pred"
                    title="Prediction UI"
                    src="{{ url_for('index') }}"></iframe>
          
            <!-- EDA -->
            <iframe id="panel-eda"
                    title="EDA UI"
                    src="{{ url_for('eda_home') }}"
                    style="display:none;"></iframe>
          </div>
        </div>
      </section>
    </div>

    <script>
      const btns = document.querySelectorAll(".tab-buttons button");
      const panels = {
        pred: document.getElementById("panel-pred"),
        eda: document.getElementById("panel-eda"),
      };

      function resizeCurrent() {
        const header = document.querySelector("header");
        const h = window.innerHeight - (header ? header.offsetHeight : 0) - 60; // padding
        const current =
          document.querySelector(".tab-buttons button.active")?.dataset
            .target || "pred";
        const panel = panels[current];
        if (panel) panel.style.height = Math.max(480, h) + "px";
      }

      btns.forEach((b) => {
        b.addEventListener("click", () => {
          btns.forEach((x) => x.classList.remove("active"));
          b.classList.add("active");
          panels.pred.style.display =
            b.dataset.target === "pred" ? "block" : "none";
          panels.eda.style.display =
            b.dataset.target === "eda" ? "block" : "none";
          resizeCurrent();
        });
      });

      window.addEventListener("resize", resizeCurrent);
      // init
      resizeCurrent();
    </script>
  </body>
</html>
